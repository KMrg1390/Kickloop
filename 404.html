<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<!-- Fehlerseite (2026-11-20): Vercel zeigt diese Datei bei jeder Adresse, die es nicht gibt. Zwei Wege zurück: Webseite oder Arbeitsbereich. -->
<style>
  main{max-width:640px;padding-top:clamp(32px,10vh,96px)}
  .wege{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
  .wege a{font-family:var(--display);font-stretch:100%;font-weight:700;text-decoration:none;border-radius:999px;padding:10px 20px;border:2px solid #000;color:#000;background:#fff}
  .wege a.gruen{background:#C7F105}
  .wege a:hover{filter:brightness(.95)}
  .klogo{height:44px;margin-bottom:28px}
</style>
</head><body>
<main>
  <img class="klogo on-light" src="/assets/logo-light.png" width="748" height="150" alt="Kickloop. Gute Schuhe. Zweites Leben."><img class="klogo on-dark" src="/assets/logo-dark.png" width="748" height="150" alt="" aria-hidden="true">
  <h1>Diese Seite gibt es nicht.</h1>
  <p class="lead">Vielleicht hast du dich bei der Adresse vertippt, oder die Seite ist umgezogen. Hier geht es weiter:</p>
  <div class="wege">
    <a class="gruen" href="/arbeitsbereich/">Zum Arbeitsbereich</a>
    <a href="/">Zur Webseite von Kickloop</a>
  </div>
</main>
<footer>Kickloop ist ein erfundenes Modellunternehmen für den Unterricht · © Dnk, Mrg · Hermann-Scheer-Schule</footer>
