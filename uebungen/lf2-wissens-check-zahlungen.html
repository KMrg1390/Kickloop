<title>Kickloop Wissens-Check Zahlungen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="/assets/schriften.css">
<style>
/* Layout: eine schmale Spalte wie eine App am Handy – Kopf mit Logo, eine Frage pro Bildschirm, große Antwortflächen */
:root {
  --bg: #F3F4EE;        /* heller Ton aus dem Kickloop-Logo */
  --surface: #FFFFFF;
  --ink: #1E2225;       /* Logo-Dunkel */
  --muted: #5E6560;
  --line: #D5D8CF;
  --accent: #C8F205;    /* Kickloop-Neongelb */
  --accent-ink: #1E2225;
  --ok: #2F7A4F; --ok-bg: #E3F1E8;
  --bad: #B5473A; --bad-bg: #F8E4E0;
  --font-display: "Archivo", "Arial Black", system-ui, sans-serif;
  --font-body: "Lexend", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181A; --surface: #1F2427; --ink: #EEF0EA; --muted: #A3AAA4; --line: #343B3E;
    --accent: #C8F205; --accent-ink: #15181A;
    --ok: #7CCB9A; --ok-bg: #1D3226; --bad: #F09A8C; --bad-bg: #3A2320;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15181A; --surface: #1F2427; --ink: #EEF0EA; --muted: #A3AAA4; --line: #343B3E;
  --accent: #C8F205; --accent-ink: #15181A;
  --ok: #7CCB9A; --ok-bg: #1D3226; --bad: #F09A8C; --bad-bg: #3A2320;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 40px;
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.logo { background: #FFFFFF; border-radius: 10px; padding: 6px 10px; display: inline-flex; }
.logo img { height: 30px; width: auto; display: block; }
.tag { font-size: 13px; color: var(--muted); letter-spacing: .02em; }
h1 { font-family: var(--font-display); font-size: 30px; line-height: 1.1; margin: 0; text-wrap: balance; }
h2 { font-size: 21px; line-height: 1.3; margin: 0; text-wrap: balance; }
p { margin: 0; }
.lead { color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.stunden { display: grid; gap: 10px; }
.stunde-btn { text-align: left; display: flex; gap: 14px; align-items: center; }
.num { font-family: var(--font-display); font-size: 22px; width: 44px; height: 44px; flex: none; border-radius: 50%;
  background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
button { font: inherit; color: inherit; cursor: pointer; }
.btn { background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 14px 16px; min-height: 56px; width: 100%; }
.btn:hover { border-color: var(--ink); }
.btn:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn small { display: block; color: var(--muted); font-size: 14px; }
.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 700; }
.primary:hover { opacity: .9; }
.progress { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.context { background: var(--bg); border-left: 4px solid var(--accent); padding: 10px 12px; border-radius: 6px; font-size: 15px; }
.options { display: grid; gap: 10px; }
.opt { text-align: left; }
.opt.correct { border-color: var(--ok); background: var(--ok-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt:disabled { cursor: default; }
.numrow { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.numrow input { font: inherit; font-size: 22px; padding: 10px 12px; width: 9ch; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); font-variant-numeric: tabular-nums; }
.numrow .eur { font-size: 20px; }
.numrow .btn { width: auto; flex: 1; min-width: 140px; }
.feedback { border-radius: 12px; padding: 12px 14px; font-size: 16px; }
.feedback.ok { background: var(--ok-bg); color: var(--ink); border: 1px solid var(--ok); }
.feedback.bad { background: var(--bad-bg); color: var(--ink); border: 1px solid var(--bad); }
.feedback b { display: block; margin-bottom: 2px; }
.score { font-family: var(--font-display); font-size: 56px; line-height: 1; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row .btn { flex: 1; min-width: 160px; }
.review { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 15px; }
.hint { font-size: 14px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }
</style>

function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function euro(x) { return x.toFixed(2).replace(".", ","); }
function parseNum(s) { s = String(s).replace(/€|\s/g, "").replace(/\.(?=\d{3}(\D|$))/g, "").replace(",", "."); return parseFloat(s); }

function start() {
  app.replaceChildren();
  const box = el("div", { class: "card" },
    el("h1", {}, "Wissens-Check: Zahlungen"),
    el("p", { class: "lead" }, "Sechs kurze Fragen pro Stunde. Du siehst sofort, ob deine Antwort stimmt. Wähle deine Stunde."),
    el("div", { class: "stunden" }, ...Object.entries(QUIZ).map(([id, s], i) =>
      el("button", { class: "btn stunde-btn", onclick: () => { location.hash = id; } },
        el("span", { class: "num" }, String(i + 1)),
        el("span", {}, s.titel.split(" · ")[1], el("small", {}, s.titel.split(" · ")[0] + " · 6 Fragen")))
    ))
  );
  app.append(box);
}

function begin(id) {
  const s = QUIZ[id];
  state = { id, i: 0, richtig: 0, falsch: [], fragen: s.fragen.map(f => f.o ? { ...f, order: shuffle(f.o.map((_, k) => k)) } : f) };
  frage();
}

function frage() {
  const s = QUIZ[state.id], f = state.fragen[state.i], n = state.fragen.length;
  app.replaceChildren();
  const fb = el("div", { "aria-live": "polite" });
  const weiter = el("button", { class: "btn primary", hidden: "", onclick: () => { state.i++; state.i < n ? frage() : ergebnis(); } },
    state.i + 1 < n ? "Weiter" : "Ergebnis ansehen");
  const card = el("div", { class: "card" },
    el("div", { class: "progress" }, el("span", {}, `Frage ${state.i + 1} von ${n}`), el("div", { class: "bar" }, el("span", { style: `width:${(state.i / n) * 100}%` }))),
    el("h2", {}, f.q),
    f.c ? el("div", { class: "context" }, f.c) : null
  );
  function zeige(ok, text) {
    if (ok) state.richtig++; else state.falsch.push(f.q);
    fb.replaceChildren(el("div", { class: "feedback " + (ok ? "ok" : "bad") }, el("b", {}, ok ? "Richtig!" : "Leider nicht richtig."), text));
    weiter.hidden = false; weiter.focus();
  }
  if (f.o) {
    const opts = el("div", { class: "options" });
    f.order.forEach(k => {
      const b = el("button", { class: "btn opt", onclick: () => {
        opts.querySelectorAll("button").forEach(x => x.disabled = true);
        const ok = k === f.a;
        b.classList.add(ok ? "correct" : "wrong");
        if (!ok) opts.querySelector(`[data-k="${f.a}"]`).classList.add("correct");
        zeige(ok, f.e);
      }, "data-k": String(k) }, f.o[k]);
      opts.append(b);
    });
    card.append(opts);
  } else {
    const inp = el("input", { id: `num-${state.id}-${state.i}`, inputmode: "decimal", autocomplete: "off", "aria-label": "Deine Antwort in Euro", placeholder: "0,00" });
    const pruef = el("button", { class: "btn primary", onclick: () => {
      const v = parseNum(inp.value);
      if (isNaN(v)) { fb.replaceChildren(el("p", { class: "hint" }, "Bitte gib eine Zahl ein, zum Beispiel 12,50.")); return; }
      inp.disabled = true; pruef.disabled = true;
      const ok = Math.abs(v - f.num) < 0.005;
      zeige(ok, (ok ? "" : `Richtig ist ${euro(f.num)} €. `) + f.e);
    } }, "Prüfen");
    inp.addEventListener("keydown", e => { if (e.key === "Enter" && !pruef.disabled) pruef.click(); });
    card.append(el("div", { class: "numrow" }, inp, el("span", { class: "eur" }, "€"), pruef),
      el("p", { class: "hint" }, "Schreibe mit Komma, zum Beispiel 12,50."));
  }
  card.append(fb, weiter);
  app.append(card);
}

function ergebnis() {
  const s = QUIZ[state.id], n = state.fragen.length, r = state.richtig;
  const text = r >= n - 1 ? "Sehr gut! Das sitzt." : r >= Math.ceil(n / 2) ? "Gut! Sieh dir die Fragen unten noch einmal an." : "Das musst du noch üben. Sieh in den Infotext und frag nach.";
  app.replaceChildren();
  app.append(
    el("div", { class: "card" },
      el("span", { class: "tag" }, s.titel),
      el("div", { class: "score" }, `${r} von ${n}`),
      el("p", {}, text),
      state.falsch.length ? el("div", {}, el("p", { class: "hint" }, "Diese Fragen noch einmal ansehen:"), el("ol", { class: "review" }, ...state.falsch.map(q => el("li", {}, q)))) : null,
      el("p", { class: "hint" }, "Zeig diesen Bildschirm deiner Lehrkraft.")
    ),
    el("div", { class: "row" },
      el("button", { class: "btn", onclick: () => begin(state.id) }, "Nochmal versuchen"),
      el("button", { class: "btn", onclick: () => { location.hash = ""; start(); } }, "Andere Stunde"))
  );
}

function route() { const id = location.hash.slice(1); QUIZ[id] ? begin(id) : start(); }
window.addEventListener("hashchange", route);
route();
</script>

</body></html>
